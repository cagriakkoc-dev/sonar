name: Sonar Fon Fiyatları
on:
  schedule:
    # GitHub zamanlanmış işleri saatlerce geciktirebiliyor ya da atlayabiliyor; bu yüzden birden çok tur var (her tur yalnız son 1 ayı çeker, ucuz)
    - cron: '17 15,17,19 * * 1-5'   # TR 18:17, 20:17, 22:17 (iş günleri): o günün fiyatı
    - cron: '17 4,7 * * 2-6'        # TR 07:17, 10:17 (ertesi sabah): geç açıklanan fiyatlar
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: fon-fiyat
  cancel-in-progress: false
jobs:
  fiyat:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIYAT_SURE: "22"
    steps:
      - uses: actions/checkout@v4
      - run: python3 -u bekci/fon/fon_fiyat.py
      - run: |
          git config user.name "Sonar Bekçi"; git config user.email "bekci@users.noreply.github.com"
          git add -A public/veri/fon/fiyat
          git diff --cached --quiet || (git commit -q -m "Fon fiyatları" && for n in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep 5; done)
