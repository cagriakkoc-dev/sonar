name: Sonar Fon Verisi
on:
  schedule:
    - cron: '15 7 1-14 * *'   # TR 10:15
    - cron: '15 16 1-14 * *'  # TR 19:15
  workflow_dispatch:
    inputs:
      kod:
        description: 'Fon kodu (virgülle) · HSY = tüm hisse yoğun fonlar · PILOT = ilk 15'
        required: false
        default: 'HSY'
      limit:
        description: 'Fon başına son kaç rapor'
        required: false
        default: '2'
      yeniden:
        description: 'Var olanı yeniden üret (1)'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: fon-veri
  cancel-in-progress: false
jobs:
  pdr:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: python3 bekci/fon/fon_listesi.py
      - env:
          FON_KOD: ${{ inputs.kod || 'HSY' }}
          FON_LIMIT: ${{ inputs.limit || '2' }}
          YENIDEN: ${{ inputs.yeniden }}
          FON_KAYNAK: ${{ runner.temp }}
        run: python3 bekci/fon/kap_pdr.py
      - run: python3 bekci/fon/yeniden_ayristir.py
      - run: python3 bekci/fon/dizin.py
      - run: python3 -c "import json;k=json.load(open('veri/fon/son_kosu.json'));print({x:len(k[x]) for x in ('basarili','atlandi','hata')});print(json.dumps(k['hata'],ensure_ascii=False)[:3000])"
      - run: |
          git config user.name "Sonar Bekçi"; git config user.email "bekci@users.noreply.github.com"
          git add -A veri/fon public/veri/fon
          git diff --cached --quiet || (git commit -q -m "Fon PDR verisi" && for n in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep 5; done)
