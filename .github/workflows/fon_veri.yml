name: Sonar Fon Verisi
on:
  schedule:
    - cron: '15 7 1-14 * *'   # TR 10:15
    - cron: '15 16 1-14 * *'  # TR 19:15
  workflow_dispatch:
    inputs:
      kod:
        description: 'Fon kodu (virgülle birden çok)'
        required: false
        default: 'MAC'
      limit:
        description: 'Fon başına son kaç rapor'
        required: false
        default: '3'
      yeniden:
        description: 'Var olanı yeniden üret (1)'
        required: false
        default: ''
permissions:
  contents: write
concurrency:
  group: fon-veri
  cancel-in-progress: false
jobs:
  pdr:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - env:
          FON_KOD: ${{ inputs.kod || 'MAC' }}
          FON_LIMIT: ${{ inputs.limit || '3' }}
          YENIDEN: ${{ inputs.yeniden }}
          FON_KAYNAK: ${{ runner.temp }}
        run: python3 bekci/fon/kap_pdr.py
      - run: cat veri/fon/son_kosu.json
      - run: |
          git config user.name "Sonar Bekçi"; git config user.email "bekci@users.noreply.github.com"
          git add veri/fon
          git diff --cached --quiet || (git commit -q -m "Fon PDR verisi [skip render]" && for n in 1 2 3 4 5; do git pull -q --rebase && git push -q && break; sleep 5; done)
