name: Tüm BIST veri toplama
# bekci/araclar/toplu.py. liste: KAP FR listeleri + dönem seçimi; veri: 4 parçada paralel XBRL, fiyat, İş Yatırım temettü tablosu, KAP logosu.
on:
  schedule:
    - cron: '23 */3 * * *'   # GitHub yoğunlukta yarım saatlik zamanlamayı seyreltiyordu (günde ~4 çalışma); 3 saatte bir yeter: yeni dönem raporlarını toplar
  push:
    paths: ['bekci/toplu/tetik', 'bekci/araclar/toplu.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: toplu
  cancel-in-progress: false
jobs:
  liste:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            bekci/araclar
            bekci/toplu
          sparse-checkout-cone-mode: false
      - run: python3 bekci/araclar/toplu.py
        env: { FAZ: liste, BUTCE_DK: '22' }
      - run: |
          git config user.name "Sonar Bekçi"; git config user.email "bekci@users.noreply.github.com"
          git add bekci/toplu
          git diff --cached --quiet || (git commit -q -m "Tüm BIST: FR listeleri [skip render]" && for n in 1 2 3 4 5 6; do git pull -q --rebase && git push -q && break; sleep $((RANDOM % 10 + 3)); done)
  veri:
    needs: liste
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            bekci/araclar
            bekci/toplu
            bekci/xbrl
          sparse-checkout-cone-mode: false
      - run: git pull -q --rebase || true
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - run: python3 bekci/araclar/toplu.py
        env: { FAZ: veri, BUTCE_DK: '30', SHARD: '${{ matrix.shard }}', NSHARD: '3' }
      - run: |
          git config user.name "Sonar Bekçi"; git config user.email "bekci@users.noreply.github.com"
          git add bekci/toplu bekci/xbrl
          git diff --cached --quiet || (git commit -q -m "Tüm BIST: veri ${{ matrix.shard }} [skip render]" && for n in 1 2 3 4 5 6 7 8; do git pull -q --rebase && git push -q && break; sleep $((RANDOM % 15 + 3)); done)
