<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <link rel="stylesheet" href="/tr/css/project.css" />
    <title>Sabancı Holding</title>
  </head>
  <style>
    body { height: auto; background: #f4f7ff !important; }
    .headerContainer{ padding: 40px 0 20px;}
    .headerLogo{text-align:center;}
    ._404Container{float:left;width:100%;margin:0 auto!important;position:relative!important;}
    ._404Container .floatLeft{ width: 100%; float: none; text-align: center;}
    ._404Container .dangerIcon{margin:200px 0 50px;}
    .contentContainer{text-align:center;}
    .contentContainer h1{font-size:29px;color:#171796;}
    .contentContainer p{font-size:20px;color:#9eb0c9;}
    .contentContainer .allBtn{font-size:21px;color:#171796!important;position: relative;right:0;bottom:0;padding:15px 40px 15px 45px;border-radius:30px;display:inline-block;margin:30px 0 0;}
  </style>
  <body>
    <form id="form1" runat="server">
      <header>
        <aside class="headerContainer">
          <div class="headerLogo">
            <a href="/tr"><img src="/tr/images/logo/logo.png" alt="Sabancı Yatırımcı İlişkileri"></a>
          </div>
        </aside>
      </header>
        <div class="_404Container">
        	<div class="floatLeft">
            <img src="/tr/images/common/404-danger.png" class="dangerIcon" alt="404 danger icon"/>
          </div>
          <div class="contentContainer">
            <h1>Aradığınız sayfaya ulaşılamıyor!</h1>
            <p>İçerik yayından kaldırılmış ya da hatalı bir bağlantı içeriyor olabilir.</p>
            <a href="/tr" class="allBtn">Ana Sayfa<img src="/tr/images/etc/right-arrow-icon.png" alt="Sabancı Yatırımcı İlişkileri anasayfasına git"></a>
          </div>
        </div>
    </form>
  </body>
</html>
